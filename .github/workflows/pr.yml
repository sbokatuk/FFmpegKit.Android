name: pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: resolve beta version and older tracks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tracks: ${{ steps.tracks.outputs.tracks }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its parents, which is all the older-track diff below reads.
          fetch-depth: 2

      - id: resolve
        run: |
          # FFmpegVersion, not FFmpegKitNativeVersion: package versions name the FFmpeg a build
          # contains (8.1.2), not the fork's own release number (8.1.7). The PR number and run
          # number make each prerelease unique, since nuget.org never allows a version to be
          # reused.
          base=$(grep -oPm1 '(?<=<FFmpegVersion>)[^<]+' Directory.Build.props)
          if [ -z "${base}" ]; then
            echo "::error::could not read FFmpegVersion from Directory.Build.props"
            exit 1
          fi
          version="${base}-beta.${{ github.event.number }}.${{ github.run_number }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${version}" >> "$GITHUB_STEP_SUMMARY"

      - id: tracks
        run: |
          # This runs on the merge commit, so its first parent is the base branch as this pull
          # request would merge into it, and the diff is exactly what merging would change.
          tracks="$(./.github/scripts/tracks-to-verify.sh HEAD^1 HEAD)"
          echo "tracks=${tracks}" >> "$GITHUB_OUTPUT"
          echo "Older tracks to verify: \`${tracks}\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # The tracks that are not the default, so no pull request ever packed them, and release.yml packs a
  # tag without verifying it. On demand rather than on every pull request: nothing reaches an older
  # track until its release note merges, and its .aar only changes with its mapping row, so
  # tracks-to-verify.sh runs a track on exactly those. Running them all the time would double this
  # workflow for pull requests that ship nothing on those tracks, and the extra emulators are more
  # chances for a slow boot to hold up the betas. A public repository pays nothing for the minutes.
  #
  # A beta of the track's own FFmpeg, because run-device-tests.sh reads the FFmpeg the package has to
  # contain from the version. They stay in this run: publish below only takes the default track's.
  older-tracks:
    name: older track ${{ matrix.track.ffmpeg }}
    needs: version
    if: needs.version.outputs.tracks != '[]'
    strategy:
      # Tracks bind different .aar files, so one failing says nothing about the other.
      fail-fast: false
      matrix:
        track: ${{ fromJSON(needs.version.outputs.tracks) }}
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ matrix.track.ffmpeg }}-beta.${{ github.event.number }}.${{ github.run_number }}
      native-version: ${{ matrix.track.ffmpegkit }}
      artifact-suffix: -${{ matrix.track.ffmpeg }}
      # Both API levels, because FFmpegKit 7.1.6 was only refused on API 31, and both variants,
      # because that hit Video on both ABIs and Audio on x86_64 alone. net8 is where those failures
      # and the freeze were reproduced, and sample-run covers net10.
      e2e-variants: '["Audio", "Video"]'
      e2e-target-frameworks: '["net8.0-android34.0"]'
      e2e-api-levels: '[31, 35]'

  publish:
    name: publish beta to nuget.org
    needs: [version, build, older-tracks]
    runs-on: ubuntu-latest
    # Forked pull requests get no OIDC token for this repository, so the exchange would fail with
    # a confusing error. Those PRs still build and test; only the publish step is skipped.
    #
    # The rest is here because older-tracks is skipped on most pull requests, and a skipped
    # dependency skips this job as well unless the condition says what it accepts. !cancelled() is
    # what lets the condition be evaluated at all. A failed version job fails this too: it skips
    # build, and build has to have succeeded.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.older-tracks.result)
      && github.event.pull_request.head.repo.full_name == github.repository
    # Must match the Environment on the nuget.org trusted publishing policy for this workflow.
    environment: nuget.org
    permissions:
      contents: read
      # Lets the job request the OIDC token that nuget.org exchanges for a short-lived API key.
      # Without it the token request fails silently and the login step gets no key.
      id-token: write
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      # Deliberately immediately before the push: the issued key is valid for one hour, and each
      # OIDC token can be exchanged exactly once.
      - name: Authenticate to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          # Symbol packages are pushed automatically alongside each matching .nupkg.
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Summarise
        run: |
          {
            echo "### Published \`${{ needs.version.outputs.version }}\` to nuget.org"
            echo
            for variant in Audio Full FullGpl Https HttpsGpl Min MinGpl Video; do
              id="FFmpegKit.Net.${variant}.Android"
              echo "- [${id}](https://www.nuget.org/packages/${id}/${{ needs.version.outputs.version }})"
            done
          } >> "$GITHUB_STEP_SUMMARY"
