name: build

# Reusable pipeline: builds every FFmpegKit variant at a given version, validates the packed
# packages, runs the on-device smoke tests and the sample, and uploads the packages as an artifact.
# Callers (pr.yml, release.yml) decide the version and what to do with the result.

on:
  workflow_call:
    inputs:
      verify:
        description: >
          Whether to run the verification jobs — package validation, the sample builds, the
          Release link checks and the e2e suites. Pull requests leave it at true, and are the only
          place any of this runs. Releases pass false: the tagged commit was already verified on
          its pull request, so a tag packs and publishes and nothing more. The gate is the same
          input, with the same name and the same meaning, in every repository.
        required: false
        default: true
        type: boolean
      version:
        description: NuGet version to stamp on every package.
        required: true
        type: string
      native-version:
        description: >
          FFmpegKit native version to bind against. Defaults to FFmpegKitNativeVersion in
          Directory.Build.props; set it to build a package for an older LTS line, e.g. 6.0.3.
        required: false
        default: ''
        type: string
      e2e-variants:
        description: >
          Which variants the emulator smoke test installs and runs, as a JSON array - one matrix
          job per entry, and one per entry of e2e-target-frameworks. All eight, because each is a
          different .aar with its own libraries: a Video-only run hid a wrong assumption about
          Min, and nothing else in this workflow loads the other seven's native code. A subset
          saves runner minutes that a public repository does not pay for.
        required: false
        default: '["Audio", "Full", "FullGpl", "Https", "HttpsGpl", "Min", "MinGpl", "Video"]'
        type: string
      e2e-target-frameworks:
        description: >
          Which of the package's target frameworks every variant runs against, as a JSON array.
          Defaults to net10, whose assets are produced by the merge step in BuildNugets.sh, per
          variant, and so are the only ones that could be grafted in wrong. net8, the oldest
          asset set and the one nothing else exercises, gets the two legs listed in the e2e job.
          net9 sits between them and comes out of the same pack pass as net8, so testing it too
          would buy little for the runner minutes.
        required: false
        default: '["net10.0-android36.0"]'
        type: string

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  pack:
    name: build and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # 9.0.x packs net8+net9 (global.json pins it) and 10.0.x packs net10. 8.0.x is installed
          # only so that its Android workload band is available - see the workload step below.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install Android workloads for every SDK band
        run: |
          # Each band supplies different reference packs: net8.0-android34.0 compiles against
          # Microsoft.Android.Ref.34 from the .NET 8 band, net9.0-android35.0 against Ref.35 from
          # the .NET 9 band, and net10.0-android36.0 against Ref.36 from the .NET 10 band.
          # The SDK is chosen by the global.json in the working directory, so each band is
          # installed from a scratch directory pinned to that SDK.
          for major in 8 9 10; do
            dir="${RUNNER_TEMP}/sdk${major}"
            mkdir -p "${dir}"
            sdk=$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)
            echo "installing android workload for SDK ${sdk}"
            ( cd "${dir}" \
              && dotnet new globaljson --sdk-version "${sdk}" --force \
              && dotnet workload install android )
          done

      - name: Set up Android SDK platforms
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-35 platforms;android-36'

      - name: Resolve native version
        id: native
        run: |
          version="${{ inputs.native-version }}"
          if [ -z "${version}" ]; then
            version=$(grep -oPm1 '(?<=<FFmpegKitNativeVersion>)[^<]+' Directory.Build.props)
          fi
          if [ -z "${version}" ]; then
            echo "::error::could not determine the FFmpegKit native version"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Binding FFmpegKit ${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache FFmpegKit binaries
        id: jars
        uses: actions/cache@v4
        with:
          path: src/FFmpegKit.Android/Jars
          # The native version is part of the key: without it a build for an older LTS line would
          # restore the previous version's .aar files and fail on the ones it actually needs.
          key: ffmpegkit-jars-${{ steps.native.outputs.version }}-${{ hashFiles('src/FFmpegKit.Android/Jars/FetchJars.sh') }}

      - name: Fetch FFmpegKit binaries
        if: steps.jars.outputs.cache-hit != 'true'
        run: ./src/FFmpegKit.Android/Jars/FetchJars.sh "${{ steps.native.outputs.version }}"

      # Runs on cache hits too: the fetch already verifies fresh downloads, but a restored
      # cache is only as trustworthy as its last write. Seconds of hashing per build.
      - name: Verify FFmpegKit binaries
        run: ./src/FFmpegKit.Android/Jars/FetchJars.sh --verify "${{ steps.native.outputs.version }}"

      - name: Pack all variants
        run: ./src/FFmpegKit.Android/BuildNugets.sh "${{ inputs.version }}" "${{ steps.native.outputs.version }}"

      - name: Validate packages
        if: ${{ inputs.verify }}
        run: dotnet test tests/FFmpegKit.Android.PackageTests --logger 'trx;LogFileName=package-tests.trx'

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: ${{ inputs.verify && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results
          path: '**/*.trx'
          if-no-files-found: ignore
          retention-days: 7

  build-samples:
    name: sample build (${{ matrix.tfm }})
    if: ${{ inputs.verify }}
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off: the net8 and net10 legs fail for opposite reasons - an old UI dependency
      # dropping the oldest band, or a new one not yet supporting the newest - so a red net10 next
      # to a green net8 already localises the cause. Cancelling one when the other breaks would
      # throw that signal away.
      fail-fast: false
      matrix:
        # The net8 and net10 extremes of what the binding package ships, each built on its own SDK
        # band. The sample restores the packed package through a PackageReference exactly as a
        # consumer would and links under the Release toolchain (R8), where a binding that restores
        # fine in Debug can still fail. It has regressed silently before - a renamed property left
        # it referencing something gone, and a wrong version property resolved a published package
        # over the one just built - both invisible until something actually built it.
        include:
          - band: net8
            tfm: net8.0-android34.0
          - band: net10
            tfm: net10.0-android36.0
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install the MAUI Android workload for the ${{ matrix.band }} band
        run: |
          # The sample targets exactly one framework per band (SampleSdkBand), so a single band's
          # workload is enough and restore never walks a framework this band cannot build. Pinned
          # through a scratch global.json because the band owns the runtime packs - a net8 app on
          # the net9 band fails at packaging with NETSDK1112.
          major="$(printf '%s' '${{ matrix.band }}' | sed 's/net//')"
          sdk="$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)"
          dir="${RUNNER_TEMP}/workload-${{ matrix.band }}"
          mkdir -p "${dir}"
          ( cd "${dir}" \
            && dotnet new globaljson --sdk-version "${sdk}" --force \
            && dotnet workload install maui-android )

      - name: Set up the Android SDK platforms
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-36'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Build the ${{ matrix.tfm }} sample against the packed package
        run: |
          # Built on the band's own SDK: the repository global.json pins .NET 9, so a scratch
          # global.json in the invocation directory selects the band that owns this framework, the
          # same mechanism run-device-tests.sh uses.
          major="$(printf '%s' '${{ matrix.band }}' | sed 's/net//')"
          sdk="$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)"
          dir="${RUNNER_TEMP}/build-${{ matrix.band }}"
          mkdir -p "${dir}"
          printf '{ "sdk": { "version": "%s", "rollForward": "latestFeature" } }\n' "${sdk}" > "${dir}/global.json"
          ( cd "${dir}" && dotnet build "${GITHUB_WORKSPACE}/samples/FFmpegKit.Android.Example/FFmpegKit.Android.Example.csproj" \
              --configuration Release -f "${{ matrix.tfm }}" \
              -p:SampleSdkBand="${{ matrix.band }}" \
              -p:FFmpegKitVersion="${{ inputs.version }}" )

  e2e:
    name: emulator smoke test (${{ matrix.variant }}, ${{ matrix.target-framework }}, API ${{ matrix.api-level }})
    if: ${{ inputs.verify }}
    timeout-minutes: 60
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off: when one leg breaks it is worth knowing which others did too, since "net8
      # only" and "everywhere", or "Min only" and "every variant", point at very different causes.
      # Separate jobs rather than one emulator working through a list: they add no wall-clock time
      # running side by side, and a failed boot re-runs one leg instead of all of them.
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.e2e-variants) }}
        target-framework: ${{ fromJSON(inputs.e2e-target-frameworks) }}
        api-level: [35]
        include:
          - variant: Video
            target-framework: net8.0-android34.0
            api-level: 35
          # Audio is the one variant whose load behaviour has depended on the ABI. FFmpegKit 7.1.6
          # and 6.0.3 mapped RELRO past the end of a library in five variants on both ABIs, and in
          # Audio on x86_64 alone, so an arm64 run says nothing about it. The failure only shows
          # on an older Android: dlopen rejected those libraries on API 31 and accepted them on
          # API 35, which is why every other leg here would pass.
          - variant: Audio
            target-framework: net8.0-android34.0
            api-level: 31
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # 8.0.x is here for the net8 matrix leg only - see the workload step below.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install the Android workload for every SDK band
        run: |
          # One band per Android API level, because that is what owns the runtime packs: API 34 is
          # the .NET 8 workload, 35 the .NET 9 one, 36 the .NET 10 one. Installing only the band
          # global.json pins lets a net8 app compile and then fail at packaging with NETSDK1112.
          # See the comment in run-device-tests.sh.
          for major in 8 10; do
            dir="${RUNNER_TEMP}/sdk${major}"
            mkdir -p "${dir}"
            ( cd "${dir}" \
              && dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)" --force \
              && dotnet workload install android )
          done
          dotnet workload install android

      - name: Set up Android SDK platforms
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-35 platforms;android-36'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Free disk space for the emulator
        run: |
          # The AVD's userdata partition needs ~7.2 GB free, and this job has already installed
          # three .NET SDK bands, three Android workloads, three platform SDKs, a system image
          # and the packed packages. Runs have died here with
          #
          #     FATAL | Not enough space to create userdata partition.
          #             Available: 5666.53 MB, need 7372.80 MB.
          #
          # which fails as an emulator boot timeout several minutes later, long after the real
          # cause scrolled past. None of the following is used by this job: no native code is
          # compiled (the .aar ships prebuilt .so files), so the NDK alone is ~5 GB of dead
          # weight. Deliberately NOT touching /usr/share/dotnet or the rest of the Android SDK.
          echo "before: $(df -h --output=avail / | tail -1) available"
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/lib/node_modules || true
          docker image prune --all --force || true
          echo "after:  $(df -h --output=avail / | tail -1) available"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run smoke tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The .aar ships arm64-v8a and x86_64 only, so the emulator must be x86_64.
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./.github/scripts/run-device-tests.sh "${{ matrix.variant }}" "${{ inputs.version }}" "${{ matrix.target-framework }}"

      - name: Upload device logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-logs-${{ matrix.variant }}-${{ matrix.target-framework }}-api${{ matrix.api-level }}
          path: device-tests-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

  # The sample used to be built here and never run, so nothing noticed when a published package
  # froze it on its first conversion: the device checks allocated too little to trigger the
  # collection that hangs. One leg is enough, because that freeze came from the package and not from
  # a framework, and net10 is the newest framework the sample builds for.
  sample-run:
    name: sample run on emulator
    if: ${{ inputs.verify }}
    timeout-minutes: 30
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install the MAUI Android workload for the net10 band
        run: |
          # From a scratch directory for the same reason as the sample build above: the repository
          # global.json pins .NET 9, and the band owns the runtime packs.
          dir="${RUNNER_TEMP}/workload-net10"
          mkdir -p "${dir}"
          ( cd "${dir}" \
            && dotnet new globaljson --sdk-version "$(dotnet --list-sdks | grep '^10\.' | tail -1 | cut -d' ' -f1)" --force \
            && dotnet workload install maui-android )

      - name: Set up the Android SDK platforms
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Free disk space for the emulator
        run: |
          # The same space problem as the e2e job, whose comment has the failure this prevents.
          echo "before: $(df -h --output=avail / | tail -1) available"
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/lib/node_modules || true
          docker image prune --all --force || true
          echo "after:  $(df -h --output=avail / | tail -1) available"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the sample on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The .aar ships arm64-v8a and x86_64 only, so the emulator must be x86_64. The profile
          # is there for its height: the script reads the status label off the accessibility tree,
          # which leaves out whatever has scrolled off screen.
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./.github/scripts/run-sample-test.sh "${{ inputs.version }}"

      - name: Upload sample logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-test-logs
          path: |
            sample-test-logcat.txt
            sample-test-screen.png
          if-no-files-found: ignore
          retention-days: 7
